name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Check TypeScript compilation (main)
      run: npx tsc --noEmit
      
    - name: Check TypeScript compilation (build)
      run: npx tsc --project tsconfig.build.json --noEmit
      
    - name: Check TypeScript compilation (tests)
      run: npx tsc --project tsconfig.test.json --noEmit
      
    - name: Run Prettier check
      run: npx prettier --check "src/**/*.{ts,js,json,md}"
      
    - name: Run quality check script
      run: npm run quality-check
      
    - name: Run tests with coverage
      run: npm run jest -- --coverage --coverageReporters=text-lcov
      
    - name: Build project (development)
      run: npm run build:dev
      
    - name: Build project (production)
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: deploy/
        retention-days: 7